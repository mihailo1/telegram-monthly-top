# Hobby Vercel only allows 1×/day crons. This workflow hits /api/queue-cron
# every 15 minutes so random 10:00–22:00 posts and cancels work correctly.
#
# Required GitHub repo secrets:
#   QUEUE_CRON_URL  = https://telegram-monthly-top.vercel.app/api/queue-cron?secret=CRON_SECRET
#   (or APP_URL + CRON_SECRET separately — see env below)

name: queue-tick

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call queue-cron
        env:
          QUEUE_CRON_URL: ${{ secrets.QUEUE_CRON_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          if [ -n "$QUEUE_CRON_URL" ]; then
            URL="$QUEUE_CRON_URL"
          elif [ -n "$APP_URL" ] && [ -n "$CRON_SECRET" ]; then
            URL="${APP_URL%/}/api/queue-cron?secret=${CRON_SECRET}"
          else
            echo "Missing secrets: set QUEUE_CRON_URL or APP_URL+CRON_SECRET"
            exit 1
          fi
          echo "GET $URL"
          curl -fsS --max-time 55 "$URL" | tee /tmp/out.json
          grep -q '"ok":true' /tmp/out.json
